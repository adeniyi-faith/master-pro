# Builds the Windows app and publishes it as a downloadable GitHub release.
# It runs when the "release-build" branch is updated or a tag starting with "v" is pushed,
# and can be started by hand from the Actions tab ("Build Windows download" > Run workflow).
name: Build Windows download

on:
  workflow_dispatch:
  push:
    branches:
      - release-build
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Optional extras (such as the "canvas" drawing library that the PDF reader can use) are skipped:
      # the app does not need them, and building them needs tools the build machine does not have.
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Package the app
        run: npx electron-forge package --platform=win32 --arch=x64

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path "out/SoftMaster PRO-win32-x64" -DestinationPath SoftMaster-PRO-windows-x64.zip

      # A single installer file (Setup.exe). If this step fails, the zip above is still published.
      - name: Make the single-file installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          # The installer builder is an "optional" extra that the install step above skips, so add it back here.
          npm install --no-save electron-winstaller@5
          npx electron-forge make --platform=win32 --arch=x64 --skip-package --targets=@electron-forge/maker-squirrel
          if ($LASTEXITCODE -ne 0) { throw "The installer build failed." }
          $setup = Get-ChildItem -Path out/make -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "SoftMaster-PRO-Setup.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "windows-build-$short" }
          $files = @("SoftMaster-PRO-windows-x64.zip")
          if (Test-Path "SoftMaster-PRO-Setup.exe") { $files += "SoftMaster-PRO-Setup.exe" }
          gh release create $tag $files --title "SoftMaster PRO ($tag)" --notes "Windows download. Easiest: download SoftMaster-PRO-Setup.exe and double-click it. Or download the zip, unzip it, then double-click SoftMaster PRO.exe." --target "${{ github.sha }}"
